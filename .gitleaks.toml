[[rules]]
id = "private-key"
[[rules.allowlists]]
description = "Synthetic multiline scanner fixture in Veilmark.cs"
condition = "AND"
paths = ['''^Veilmark\.cs$''']
regexTarget = "secret"
regexes = ['''^-----BEGIN PGP PRIVATE KEY BLOCK-----\\nSYNTHETICBLOCK\\n-----END PGP PRIVATE KEY BLOCK-----"\)\.Text == "\[REDACTED_ENCRYPTION_KEY\]", "Multiline PGP"\);\r?\n            Check\(RunText\("-----BEGIN OPENSSH PRIVATE KEY-----$''']
