title = "Veilmark Secret Checks"
minVersion = "v8.30.0"

[extend]
path = "security/gitleaks-portable.toml"

# Project exceptions are deliberately repetitive: every allowlist binds one
# exact synthetic value to one exact reviewed file. No directory, wildcard,
# neighboring value, real credential, or private publication identifier is
# exempted.

[[rules]]
id = "generic-api-key"
[[rules.allowlists]]
description = "Synthetic redaction fixture in Veilmark.cs"
condition = "AND"
paths = ['''^Veilmark\.cs$''']
regexTarget = "secret"
regexes = ['''^(?:synthetic_Secret91|copy_guard_synthetic_secret|synthetic_ui_secret|old_synthetic_value|new_synthetic_value|secret_synthetic)$''']
[[rules.allowlists]]
description = "Synthetic redaction fixture in archive/TextRedactor/TextRedactor.cs"
condition = "AND"
paths = ['''^archive/TextRedactor/TextRedactor\.cs$''']
regexTarget = "secret"
regexes = ['''^(?:synthetic_Secret91|synthetic_ui_secret|old_synthetic_value|new_synthetic_value|secret_synthetic)$''']
[[rules.allowlists]]
description = "Synthetic redaction fixture in archive/Veilmark/Veilmark.cs"
condition = "AND"
paths = ['''^archive/Veilmark/Veilmark\.cs$''']
regexTarget = "secret"
regexes = ['''^(?:synthetic_Secret91|synthetic_ui_secret|old_synthetic_value|new_synthetic_value|secret_synthetic)$''']
[[rules.allowlists]]
description = "Synthetic redaction fixture in archive/Veilmark-1.1.1/Veilmark.cs"
condition = "AND"
paths = ['''^archive/Veilmark-1\.1\.1/Veilmark\.cs$''']
regexTarget = "secret"
regexes = ['''^(?:synthetic_Secret91|synthetic_ui_secret|old_synthetic_value|new_synthetic_value|secret_synthetic)$''']
[[rules.allowlists]]
